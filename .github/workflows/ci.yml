name: BlockCtrl CI

on:
  push:
    branches: ['main', 'blockctrl/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Contract tests
        run: pnpm test:contracts
      - name: Unit tests
        run: pnpm test:unit
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build panel
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          BLOCKCTRL_PUBLIC_URL: http://127.0.0.1:3000
          DATABASE_URL: postgresql://blockctrl:blockctrl@127.0.0.1:5432/blockctrl
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-key
      - name: Build agent
        run: pnpm agent:build
